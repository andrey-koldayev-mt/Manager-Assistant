name: Deploy to VibeCode

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vibecode-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy application
    runs-on: ubuntu-latest
    env:
      # Personal vibe_api_ key that manages the Galaxy application.
      VIBE_DEPLOY_API_KEY: ${{ secrets.VIBE_DEPLOY_API_KEY }}
      # OAuth vibe_app_ key that the application uses at runtime.
      VIBE_APP_API_KEY: ${{ secrets.VIBE_API_KEY }}
      VIBE_SERVER_ID: c557c68b-fd15-427a-83a0-9e6f0238f5cb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Create deployment archive
        run: npm run archive

      - name: Validate deployment configuration
        run: |
          test -n "$VIBE_DEPLOY_API_KEY"
          test -n "$VIBE_APP_API_KEY"
          test -n "$VIBE_SERVER_ID"

      - name: Deploy to VibeCode
        run: npm run deploy:vibecode
