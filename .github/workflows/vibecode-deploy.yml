name: Deploy to VibeCode

on:
  push:
    branches:
      - codex/unified-bitrix-dashboard
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vibecode-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy application
    runs-on: ubuntu-latest
    env:
      VIBE_API_KEY: ${{ secrets.VIBE_API_KEY }}
      VIBE_SERVER_ID: 25afbe82-1162-4bb8-9bd9-770e52b1ff3f
      VIBE_DEPLOY_VERIFY_TIMEOUT_MS: 300000
      VIBE_PARTIAL_DEPLOY_TIMEOUT_MS: 600000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run typecheck
        run: npm exec vue-tsc -- --noEmit

      - name: Build application
        run: npm run build

      - name: Create deployment archive
        run: npm run archive

      - name: Validate deployment configuration
        run: |
          test -n "$VIBE_API_KEY"
          test -n "$VIBE_SERVER_ID"

      - name: Deploy to VibeCode
        run: npm run deploy:vibecode
